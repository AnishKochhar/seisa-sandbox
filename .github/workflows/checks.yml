name: seisa-checks
on: pull_request
permissions: {contents: read, checks: write, pull-requests: read}
jobs:
  seisa-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Review stand-in (fails if the PR adds a line with FIXME)
        run: |
          git fetch -q origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD -- . ':!.github' > d.txt || exit 1
          if grep -q "^+.*FIXME" d.txt; then echo "seisa-review: FIXME found"; exit 1; fi
          echo "seisa-review: pass"
  seisa-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 'test -f README.md && echo seisa-test-pass'
